<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation Masterclass</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 30px;
            transition: background-color 0.4s ease;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }

        .section {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 1.2rem;
            color: #34495e;
            margin-bottom: 12px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"] {
            padding: 10px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
            flex: 1;
            min-width: 200px;
        }

        button {
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:active {
            transform: scale(0.98);
        }

        button.btn-danger {
            background-color: #e74c3c;
        }
        button.btn-danger:hover {
            background-color: #c0392b;
        }

        button.btn-success {
            background-color: #2ecc71;
        }
        button.btn-success:hover {
            background-color: #27ae60;
        }

        /* Target Display Areas */
        #content-box {
            padding: 15px;
            border: 2px dashed #bdc3c7;
            border-radius: 6px;
            min-height: 50px;
            background-color: #ffffff;
            transition: all 0.3s ease;
        }

        /* Dynamic Item List */
        .item-list {
            list-style: none;
            margin-top: 10px;
        }

        .item-list li {
            background: #edf2f7;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #3498db;
            transition: all 0.3s ease;
        }

        /* Custom Class for Toggle Demonstration */
        .highlight {
            background-color: #f1c40f !important;
            color: #2c3e50 !important;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.6;
            border-left-color: #95a5a6 !important;
        }

        .badge {
            background-color: #e74c3c;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DOM Manipulation Interactive Demo</h1>

        <!-- Scenario 1: Text & HTML Updating -->
        <div class="section">
            <h2>1. Text & Inner HTML Updates</h2>
            <div class="controls">
                <input type="text" id="text-input" placeholder="Type something here..." value="Hello World!">
                <button id="btn-update-text">Set textContent</button>
                <button id="btn-update-html">Set innerHTML (with Tags)</button>
            </div>
            <div id="content-box">Target Area for Text/HTML updates...</div>
        </div>

        <!-- Scenario 2: Styling & Background Manipulation -->
        <div class="section">
            <h2>2. Styles, Colors & Backgrounds</h2>
            <div class="controls">
                <button id="btn-bg-box">Change Box Background</button>
                <button id="btn-bg-page">Change Page Background</button>
                <button id="btn-toggle-highlight">Toggle Class (.highlight)</button>
                <button id="btn-reset-styles" class="btn-danger">Reset Styles</button>
            </div>
        </div>

        <!-- Scenario 3: Adding & Removing Elements -->
        <div class="section">
            <h2>3. Adding & Removing Dynamic Elements</h2>
            <div class="controls">
                <input type="text" id="item-input" placeholder="Enter new item name...">
                <button id="btn-add-item" class="btn-success">Add New Element</button>
                <button id="btn-clear-all" class="btn-danger">Clear All Elements</button>
            </div>
            <ul id="item-container" class="item-list">
                <!-- Dynamic list items will appear here -->
            </ul>
        </div>

        <!-- Scenario 4: Attributes & Properties Manipulation -->
        <div class="section">
            <h2>4. Attribute & Property Manipulation</h2>
            <div class="controls">
                <button id="btn-add-attr">Add Custom Attribute</button>
                <button id="btn-check-attr">Read Attribute</button>
                <button id="btn-disable-input">Toggle Input Disabled</button>
            </div>
            <p id="attr-output" style="font-size: 0.9rem; color: #7f8c8d; margin-top: 5px;"></p>
        </div>
    </div>

    <script>
        // =================================================================
        // SCENARIO 1: UPDATING CONTENT (innerText vs innerHTML)
        // =================================================================
        const textInput = document.getElementById('text-input');
        const btnUpdateText = document.getElementById('btn-update-text');
        const btnUpdateHtml = document.getElementById('btn-update-html');
        const contentBox = document.getElementById('content-box');

        // Update plain text (Escapes any HTML tags automatically)
        btnUpdateText.addEventListener('click', () => {
            const val = textInput.value;
            contentBox.textContent = val; 
        });

        // Update inner HTML (Parses and renders HTML elements)
        btnUpdateHtml.addEventListener('click', () => {
            const val = textInput.value;
            contentBox.innerHTML = `<strong>Formatted HTML Output:</strong> <em>${val}</em> <span class="badge">New</span>`;
        });


        // =================================================================
        // SCENARIO 2: STYLING & BACKGROUND MANIPULATION
        // =================================================================
        const btnBgBox = document.getElementById('btn-bg-box');
        const btnBgPage = document.getElementById('btn-bg-page');
        const btnToggleHighlight = document.getElementById('btn-toggle-highlight');
        const btnResetStyles = document.getElementById('btn-reset-styles');

        // Helper function for random colors
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Direct style manipulation on specific element
        btnBgBox.addEventListener('click', () => {
            contentBox.style.backgroundColor = getRandomColor();
            contentBox.style.color = '#ffffff';
            contentBox.style.padding = '25px';
        });

        // Direct style manipulation on body element
        btnBgPage.addEventListener('click', () => {
            document.body.style.backgroundColor = getRandomColor();
        });

        // Class manipulation using classList (add/remove/toggle)
        btnToggleHighlight.addEventListener('click', () => {
            contentBox.classList.toggle('highlight');
        });

        // Reset all styles back to default
        btnResetStyles.addEventListener('click', () => {
            contentBox.removeAttribute('style');
            document.body.removeAttribute('style');
            contentBox.className = ''; // remove all classes
        });


        // =================================================================
        // SCENARIO 3: CREATING & REMOVING DOM ELEMENTS
        // =================================================================
        const itemInput = document.getElementById('item-input');
        const btnAddItem = document.getElementById('btn-add-item');
        const btnClearAll = document.getElementById('btn-clear-all');
        const itemContainer = document.getElementById('item-container');

        function createNewItem() {
            const itemText = itemInput.value.trim();
            if (itemText === '') {
                alert('Please enter a valid item name!');
                return;
            }

            // 1. Create element
            const li = document.createElement('li');

            // 2. Add text and HTML structure
            li.innerHTML = `
                <span class="item-text">${itemText}</span>
                <div>
                    <button class="btn-toggle-complete" style="background:#f39c12; margin-right:5px; padding:5px 10px;">Done</button>
                    <button class="btn-delete btn-danger" style="padding:5px 10px;">Delete</button>
                </div>
            `;

            // 3. Append element to DOM parent
            itemContainer.appendChild(li);

            // 4. Clear input field
            itemInput.value = '';
        }

        // Add item on button click
        btnAddItem.addEventListener('click', createNewItem);

        // Add item on 'Enter' keypress
        itemInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') createNewItem();
        });

        // Event Delegation for dynamically created elements (Delete & Mark Complete)
        itemContainer.addEventListener('click', (event) => {
            // Check if Delete button was clicked
            if (event.target.classList.contains('btn-delete')) {
                const liToRemove = event.target.closest('li');
                liToRemove.remove(); // Removes element from DOM
            }

            // Check if Complete button was clicked
            if (event.target.classList.contains('btn-toggle-complete')) {
                const itemTextSpan = event.target.closest('li').querySelector('.item-text');
                itemTextSpan.classList.toggle('completed');
            }
        });

        // Remove all children at once
        btnClearAll.addEventListener('click', () => {
            itemContainer.innerHTML = ''; // Fast way to remove all inner DOM elements
        });


        // =================================================================
        // SCENARIO 4: ATTRIBUTES & PROPERTIES
        // =================================================================
        const btnAddAttr = document.getElementById('btn-add-attr');
        const btnCheckAttr = document.getElementById('btn-check-attr');
        const btnDisableInput = document.getElementById('btn-disable-input');
        const attrOutput = document.getElementById('attr-output');

        // Set custom attribute
        btnAddAttr.addEventListener('click', () => {
            contentBox.setAttribute('data-status', 'active');
            contentBox.setAttribute('title', 'This box has custom attributes!');
            attrOutput.textContent = 'Attribute set: data-status="active" and title added.';
        });

        // Get attribute value
        btnCheckAttr.addEventListener('click', () => {
            const status = contentBox.getAttribute('data-status');
            const title = contentBox.getAttribute('title');
            if (status) {
                attrOutput.textContent = `Found Attributes -> data-status: "${status}", title: "${title}"`;
            } else {
                attrOutput.textContent = 'No custom attributes found. Click "Add Custom Attribute" first.';
            }
        });

        // Toggle element property (disabled state)
        btnDisableInput.addEventListener('click', () => {
            textInput.disabled = !textInput.disabled;
            attrOutput.textContent = `Input disabled state is now: ${textInput.disabled}`;
        });
    </script>
</body>
</html>
